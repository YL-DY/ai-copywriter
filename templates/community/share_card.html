<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} - InkFlow</title>
  <meta property="og:title" content="{{ post.title }}">
  <meta property="og:description" content="{{ excerpt }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="InkFlow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: #f5f5f5; color: #1a1a2e; display: flex; justify-content: center; padding: 40px 20px;
    }
    .card {
      max-width: 480px; width: 100%; background: #fff; border-radius: 16px;
      overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px 24px; color: #fff; text-align: center;
    }
    .card-header h1 { font-size: 22px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
    .card-header .meta { font-size: 12px; opacity: 0.8; }
    .card-body { padding: 24px; }
    .card-body .excerpt { font-size: 14px; line-height: 1.7; color: #555; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 0; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #f0f0f5; color: #666; font-size: 11px; }
    .card-footer {
      padding: 16px 24px; border-top: 1px solid #eee;
      display: flex; align-items: center; justify-content: space-between;
    }
    .author-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .author-name { font-size: 13px; font-weight: 600; }
    .brand { font-size: 11px; color: #999; }
    .read-more {
      display: inline-block; padding: 8px 20px; border-radius: 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; text-decoration: none; font-size: 13px; font-weight: 600;
      margin-top: 16px; text-align: center;
    }
    .cta { text-align: center; padding: 8px 0 24px; }
    .cta .slogan { font-size: 12px; color: #999; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>{{ post.title }}</h1>
      <div class="meta">{{ post.created_at | localtime("%Y年%m月%d日") }}</div>
    </div>
    <div class="card-body">
      <p class="excerpt">{{ excerpt }}</p>
      {% if tags %}
      <div class="card-tags">
        {% for t in tags %}
        <span class="tag">{{ t }}</span>
        {% endfor %}
      </div>
      {% endif %}
      <div class="cta">
        <a href="{{ site_url }}community/post/{{ post.id }}" class="read-more">阅读全文</a>
        <p class="slogan">文字有温度，也值得被看见</p>
      </div>
    </div>
    <div class="card-footer">
      <div class="author-info">
        <div class="avatar">{{ (author.nickname or author.username)[:1] }}</div>
        <span class="author-name">{{ author.nickname or author.username }}</span>
      </div>
      <span class="brand">InkFlow</span>
    </div>
  </div>
</body>
</html>

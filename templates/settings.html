{% extends "base.html" %}
{% block title %}API Key 设置 - InkFlow{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <h1>⚙️ API Key 设置</h1>
        <p style="text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:24px;">
            你可以在这里配置自己的 DeepSeek API Key，也可以使用系统默认 Key（每日有限额）。
        </p>

        <form method="POST">
            <label for="api_key">主 API Key</label>
            <input type="text" id="api_key" name="api_key" value="{{ current_user.api_key }}" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="font-family:monospace;letter-spacing:0.5px;">

            <label for="backup_api_key">备用 API Key <span style="color:var(--text-subtle);font-weight:400;">（可选，主 Key 用完后自动轮换）</span></label>
            <input type="text" id="backup_api_key" name="backup_api_key" value="{{ current_user.backup_api_key }}" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="font-family:monospace;letter-spacing:0.5px;">

            <div style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.12);border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:12px;color:var(--text-muted);">
                <div style="font-weight:600;color:#fbbf24;margin-bottom:4px;">💡 提示</div>
                <div>设置自己的 API Key 后，系统将优先使用你的 Key 而非默认 Key，不受每日次数限制。备用 Key 会在主 Key 请求失败时自动换用。</div>
            </div>

            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;">💾 保存</button>
                <a href="{{ url_for('profile') }}" class="btn btn-outline" style="flex:1;justify-content:center;text-decoration:none;">← 返回个人中心</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

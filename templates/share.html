<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ parsed_title or item.product }} - InkFlow 灵笔</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Serif SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;
            min-height: 100vh;
            background: #121212;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding: 60px 20px 80px;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(212, 163, 115, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(233, 196, 106, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
        }
        .reader {
            max-width: 600px;
            width: 100%;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(32px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-section {
            text-align: center;
            margin-bottom: 48px;
        }
        .brand-name {
            font-family: "Cormorant Garamond", "Playfair Display", serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #D4A373, #E9C46A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transform: rotate(-0.5deg);
            display: inline-block;
        }
        .brand-sub {
            display: block;
            font-size: 13px;
            color: rgba(148, 163, 184, 0.4);
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 300;
        }
        .ornament-line {
            width: 60px;
            height: 1px;
            margin: 0 auto 48px;
            background: linear-gradient(90deg, transparent, rgba(212, 163, 115, 0.15), transparent);
        }
        .main-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: 1px;
            color: #f1f5f9;
            margin-bottom: 40px;
            text-align: center;
        }
        .main-content {
            font-size: 16px;
            line-height: 2.2;
            color: #cbd5e1;
            word-break: break-word;
            letter-spacing: 0.3px;
        }
        /* 智能排版 - 诗歌居中模式 */
        .main-content.poem-mode {
            text-align: center;
            padding: 16px 8px;
        }
        .main-content.poem-mode .sl-stanza {
            margin-bottom: 24px;
        }
        .main-content.poem-mode .sl-stanza:last-child {
            margin-bottom: 0;
        }
        .main-content.poem-mode .sl-line {
            display: block;
            line-height: 2.4;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: #cbd5e1;
        }
        /* 智能排版 - 文章左对齐模式 */
        .main-content.article-mode {
            text-align: left;
            max-width: 680px;
            margin: 0 auto;
        }
        .main-content.article-mode .sl-paragraph {
            margin-bottom: 20px;
            line-height: 2;
            font-size: 16px;
            color: #cbd5e1;
            text-indent: 2em;
            letter-spacing: 0.3px;
        }
        .main-content.article-mode .sl-divider {
            text-align: center;
            color: rgba(212,163,115,0.2);
            font-size: 14px;
            margin: 28px 0;
            letter-spacing: 6px;
        }
        /* 智能排版 - 金句海报模式 */
        .main-content.poster-mode {
            text-align: center;
            padding: 40px 24px 36px;
            background: linear-gradient(160deg, rgba(212,163,115,0.03) 0%, rgba(233,196,106,0.02) 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .main-content.poster-mode .poster-quote {
            font-size: 48px;
            color: rgba(212,163,115,0.12);
            line-height: 1;
            margin-bottom: 4px;
            font-family: "Cormorant Garamond", serif;
        }
        .main-content.poster-mode .poster-text {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
            color: #f1f5f9;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .content-divider {
            text-align: center;
            margin: 48px 0;
            color: rgba(148, 163, 184, 0.15);
            font-size: 14px;
            letter-spacing: 8px;
            user-select: none;
        }
        .footer-section {
            text-align: center;
            padding: 40px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer-brand {
            font-family: "Cormorant Garamond", "Playfair Display", serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #D4A373, #E9C46A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            transform: rotate(-0.5deg);
        }
        .footer-tagline {
            font-size: 13px;
            color: rgba(148, 163, 184, 0.3);
            margin-top: 8px;
            letter-spacing: 2px;
            font-weight: 300;
        }
        .footer-time {
            font-size: 11px;
            color: rgba(148, 163, 184, 0.15);
            margin-top: 20px;
            letter-spacing: 1px;
        }
        .actions {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s;
            font-family: "Noto Serif SC", serif;
            letter-spacing: 0.5px;
            backdrop-filter: blur(12px);
        }
        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
        }
        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border-color: rgba(212, 163, 115, 0.2);
        }
        .btn-origin {
            background: rgba(212, 163, 115, 0.08);
            border: 1px solid rgba(212, 163, 115, 0.12);
            color: #D4A373;
        }
        .btn-origin:hover {
            background: rgba(212, 163, 115, 0.12);
            transform: translateY(-1px);
        }
        .toast {
            position: fixed;
            bottom: 88px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: rgba(24, 24, 27, 0.95);
            backdrop-filter: blur(10px);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
            pointer-events: none;
            font-family: "Noto Serif SC", serif;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 600px) {
            body { padding: 40px 16px 100px; }
            .brand-section { margin-bottom: 36px; }
            .brand-name { font-size: 24px; letter-spacing: 4px; }
            .ornament-line { margin-bottom: 36px; }
            .main-title { font-size: 24px; margin-bottom: 28px; word-break: break-word; }
            .main-content { font-size: 15px; line-height: 2.0; }
            .main-content.poem-mode { padding: 12px 4px; }
            .main-content.poem-mode .sl-line { font-size: 15px; line-height: 2.0; }
            .main-content.article-mode .sl-paragraph { font-size: 15px; text-indent: 1.5em; }
            .main-content.poster-mode { padding: 28px 16px 24px; }
            .main-content.poster-mode .poster-text { font-size: 18px; }
            .actions { bottom: 24px; gap: 8px; flex-wrap: wrap; justify-content: center; }
            .btn { padding: 8px 18px; font-size: 12px; }
            .footer-section { padding: 28px 0 0; }
        }
    </style>
</head>
<body>
    <div class="reader">
        <div class="brand-section">
            <div class="brand-name">InkFlow</div>
            <span class="brand-sub">有些故事，适合深夜阅读。</span>
        </div>
        <div class="ornament-line"></div>
        {% if parsed_title %}
        <div class="main-title">{{ parsed_title }}</div>
        {% endif %}
        <div class="main-content" id="shareContent"></div>
        <div class="content-divider">· · ·</div>
        <div class="footer-section">
            <span class="footer-brand">InkFlow 灵笔</span>
            <span class="footer-tagline">把说不出口的话写出来</span>
            <div class="footer-time">{{ item.created_at | localtime("%Y年%m月%d日") }}</div>
        </div>
    </div>
    <div class="actions">
        <button class="btn btn-copy" onclick="copyContent()">📋 复制</button>
        <a href="{{ url_for('home', _external=True) }}" class="btn btn-origin">去 InkFlow 写下你的故事</a>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        // 从后端传递的清洗后内容
        var shareContent = {{ parsed_content | tojson | safe }};

        // 智能排版渲染
        function renderSmartLayout() {
            var container = document.getElementById('shareContent');
            var text = shareContent;
            if (!text) return;
            var charCount = text.replace(/\s/g, '').length;
            var lines = text.split('\n');
            var newlineRatio = lines.length > 1 ? (text.match(/\n/g) || []).length / text.length : 0;
            var isDenseNewlines = newlineRatio > 0.08;
            var hasParagraphs = false;
            var blocks = text.split(/\n\s*\n/);
            for (var i = 0; i < blocks.length; i++) {
                if (blocks[i].replace(/\s/g, '').length > 30) {
                    hasParagraphs = true;
                    break;
                }
            }
            var mode = 'article';
            if (charCount <= 20) {
                mode = 'poster';
            } else if ((charCount <= 180 && isDenseNewlines) || (charCount <= 180 && !hasParagraphs)) {
                mode = 'poem';
            }
            var html = '';
            if (mode === 'poster') {
                html = '<div class="poster-quote">"</div>';
                html += '<div class="poster-text">' + escapeHtml(text) + '</div>';
            } else if (mode === 'poem') {
                var stanzas = text.split(/\n\s*\n/);
                for (var si = 0; si < stanzas.length; si++) {
                    var stanza = stanzas[si].trim();
                    if (!stanza) continue;
                    html += '<div class="sl-stanza">';
                    var poemLines = stanza.split('\n');
                    for (var li = 0; li < poemLines.length; li++) {
                        var pl = poemLines[li].trim();
                        if (!pl) continue;
                        html += '<span class="sl-line">' + escapeHtml(pl) + '</span>';
                    }
                    html += '</div>';
                }
            } else {
                var blocks2 = text.split(/\n\s*\n/);
                for (var bi = 0; bi < blocks2.length; bi++) {
                    var block = blocks2[bi].trim();
                    if (!block) continue;
                    var paras = block.split('\n');
                    for (var pi = 0; pi < paras.length; pi++) {
                        var p = paras[pi].trim();
                        if (!p) continue;
                        html += '<div class="sl-paragraph">' + escapeHtml(p) + '</div>';
                    }
                    if (bi < blocks2.length - 1) {
                        html += '<div class="sl-divider">· · ·</div>';
                    }
                }
            }
            container.innerHTML = html;
            container.className = 'main-content ' + mode + '-mode';
        }
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
        document.addEventListener('DOMContentLoaded', renderSmartLayout);

        function copyContent() {
            var el = document.getElementById('shareContent');
            var text = el.innerText;
            navigator.clipboard.writeText(text).then(function() {
                showToast('已复制到剪贴板');
            }).catch(function() {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('已复制到剪贴板');
            });
        }
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2500);
        }
    </script>
</body>
</html>

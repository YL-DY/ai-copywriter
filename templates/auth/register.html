{% extends "base.html" %}
{% block title %}注册 - Inkflow{% endblock %}
{% block content %}
<div class="container" style="max-width: 450px; margin-top: 100px;">
    <div class="card">
        <h1>注册</h1>
        <form method="POST">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请设置用户名" required>

            <label>邮箱</label>
            <input type="email" name="email" placeholder="请输入邮箱" required>

            <label>密码（至少6位）</label>
            <input type="password" name="password" placeholder="请设置密码" minlength="6" required>

            <button type="submit" class="btn btn-primary" style="width:100%;">注册</button>
        </form>
        <div class="auth-link">
            已有账号？<a href="{{ url_for('auth.login') }}">去登录</a>
        </div>
    </div>
</div>
{% endblock %}

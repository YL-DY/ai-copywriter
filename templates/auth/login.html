{% extends "base.html" %}
{% block title %}登录 - Inkflow{% endblock %}
{% block content %}
<!-- ===== Splash Screen ===== -->
<div id="splash">
    <div class="splash-inner">
        <div class="splash-brand">Inkflow</div>
        <div class="splash-sub">灵笔</div>
    </div>
</div>
<!-- ===== Login Form ===== -->
<div id="loginPage" style="display:none;">
<div class="container" style="max-width: 450px; margin-top: 100px;">
    <div class="card">
        <h1>登录</h1>
        <form method="POST">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required>

            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>

            <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
        </form>
        <div class="auth-link">
            还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
        </div>
    </div>
</div>
</div>

<style>
#splash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0f1a;
    z-index: 9999;
    animation: splashOut 0.6s 3s cubic-bezier(0.7, 0, 0.3, 1) both;
}
.splash-inner {
    text-align: center;
    animation: splashIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.splash-brand {
    font-family: "Dancing Script", "Caveat", cursive;
    font-size: 56px;
    font-weight: 700;
    background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 50%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    transform: rotate(-2deg);
    text-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
}
.splash-sub {
    font-size: 18px;
    color: #475569;
    letter-spacing: 8px;
    margin-top: 8px;
    font-weight: 300;
}
@keyframes splashIn {
    from { opacity: 0; transform: scale(0.9) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes splashOut {
    from { opacity: 1; }
    to { opacity: 0; pointer-events: none; }
}
</style>

<script>
// 3秒后淡出 splash，显示登录页
setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('loginPage').style.display = 'block';
}, 3000);
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}登录 - Inkflow{% endblock %}
{% block content %}
<div class="container" style="max-width: 450px; margin-top: 100px;">
    <div class="card">
        <h1>登录</h1>
        <form method="POST">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required>

            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>

            <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
        </form>

        <div class="divider">
            <span>或</span>
        </div>

        <a href="{{ url_for('auth.wechat_login') }}" class="btn btn-wechat">
            <span class="wechat-icon">&#xe60b;</span> 微信扫码登录
        </a>

        <div class="auth-link">
            还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
        </div>
    </div>
</div>

<style>
    .divider {
        display: flex;
        align-items: center;
        margin: 20px 0;
        color: var(--text-subtle);
        font-size: 12px;
        gap: 12px;
    }
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border-color);
    }
    .btn-wechat {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
        border: 1px solid #07C160;
        border-radius: 10px;
        background: #07C160;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: all 0.2s;
        cursor: pointer;
        box-sizing: border-box;
        font-family: inherit;
    }
    .btn-wechat:hover {
        background: #06AD56;
        border-color: #06AD56;
        transform: translateY(-1px);
    }
    .btn-wechat .wechat-icon {
        font-size: 20px;
        margin-right: 8px;
    }
</style>
{% endblock %}
